[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
z3 = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }

[features]
default = ["z3-gh-release"]
z3-gh-release = ["z3/gh-release"]
z3-vendored = ["z3/vendored"]
